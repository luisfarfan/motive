[package]
name = "motive"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
gpui-kit = "=0.10.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.10"
libc = "0.2"
async-channel = "=2.5.0"
motive-show-control = { path = "show-control" }
raw-window-handle = "0.6"

[build-dependencies]
cc = "1"

[profile.dev]
debug = 1
