<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Motive — Your production. Your machine.</title>
  <desc id="desc">An original geometric M mark with layered frames in mint, blue and coral on a dark background.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#080d15"/></linearGradient>
    <linearGradient id="mint" x2="1" y2="1"><stop stop-color="#96ffe0"/><stop offset="1" stop-color="#45d8bb"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#203044" stroke-width=".5"/></pattern>
  </defs>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect x="700" width="500" height="380" rx="24" fill="url(#grid)" opacity=".5"/>
  <g transform="translate(62 58)">
    <rect width="44" height="44" rx="12" fill="url(#mint)"/>
    <path d="M10 32V12L22 24 34 12V32" fill="none" stroke="#102c31" stroke-width="4" stroke-linejoin="round"/>
    <text x="60" y="29" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="600" letter-spacing="5" fill="#8ca3ba">LOCAL-FIRST STUDIO</text>
  </g>
  <text x="62" y="195" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="82" font-weight="750" letter-spacing="-3" fill="#f2f7ff">Motive</text>
  <text x="66" y="242" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="27" fill="#b3c2d5">Your production. Your machine.</text>
  <text x="66" y="315" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#6ae7c7" letter-spacing="2">NATIVE RUST  /  APPLE SILICON  /  OPEN SOURCE</text>
  <g transform="translate(800 71)">
    <rect x="46" y="0" width="242" height="150" rx="16" fill="#192a45" stroke="#5379d1" stroke-width="2"/>
    <rect x="22" y="40" width="242" height="150" rx="16" fill="#102e34" stroke="#53c9ad" stroke-width="2"/>
    <rect x="0" y="80" width="242" height="150" rx="16" fill="#0b1422" stroke="#6ae7c7" stroke-width="2"/>
    <path d="M70 186V124L121 166 172 124V186" fill="none" stroke="url(#mint)" stroke-width="12" stroke-linejoin="round"/>
    <rect x="18" y="208" width="72" height="5" rx="2.5" fill="#e08069"/>
    <circle cx="217" cy="101" r="4" fill="#6ae7c7"/>
  </g>
</svg>
