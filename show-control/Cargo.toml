[package]
name = "motive-show-control"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Independent deterministic Show Control simulator for Motive"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "motive-show"
path = "src/main.rs"
